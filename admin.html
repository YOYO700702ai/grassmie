<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>後台 | 草咩咩</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/jpeg" href="https://i.ibb.co/Qj7x19LT/474636696-467764979719812-1819804518134389624-n.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <main>
    <section id="pinGate" class="pin-gate">
      <h1>草咩咩後台</h1>
      <input type="password" id="pinInput" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off">
      <button id="pinBtn">進入</button>
      <p id="pinErr" class="err"></p>
    </section>

    <section id="adminApp" hidden>
      <div class="toolbar">
        <input type="date" id="dateInput">
        <button id="refreshBtn" class="ghost">↻</button>
      </div>
      <p id="dateNote" class="note"></p>
      <table id="grid"></table>
      <p class="legend">點「空」→ 標記要關 / 點「關」→ 標記要開 / 改完按「確定」一次送出</p>
    </section>

    <div id="confirmBar" class="confirm-bar" hidden>
      <span id="pendingCount"></span>
      <button id="cancelBtn" class="ghost">取消</button>
      <button id="confirmBtn">確定</button>
    </div>
  </main>
  <div id="toast" hidden></div>
</body>
</html>
