<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>線上預約 | 草咩咩遊戲工作室</title>
  <meta name="description" content="草咩咩遊戲工作室 線上預約。選擇主題、日期、人數,送出預約申請。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
  <script src="site.js" defer></script>
  <script src="booking.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="回到首頁">
      <img src="https://i.ibb.co/Qj7x19LT/474636696-467764979719812-1819804518134389624-n.jpg" alt="草咩咩遊戲工作室 Logo">
      <span>草咩咩遊戲工作室</span>
    </a>
    <nav class="nav-links" aria-label="主要導覽">
      <a href="index.html#themes">主題</a>
      <a href="index.html#visit">資訊</a>
    </nav>
  </header>

  <main class="booking-shell">
    <div class="booking-header">
      <p class="eyebrow">Booking</p>
      <h1>線上預約</h1>
      <p class="booking-sub">選擇主題、日期人數與場次，留下聯絡資料後，我們會以電話或 Email 確認。</p>
    </div>

    <ol class="step-bar" id="stepBar">
      <li data-step="1"><span>1</span>主題</li>
      <li data-step="2"><span>2</span>日期 / 人數</li>
      <li data-step="3"><span>3</span>時段</li>
      <li data-step="4"><span>4</span>聯絡資料</li>
      <li data-step="5"><span>5</span>確認</li>
    </ol>

    <section class="booking-stage" id="bookingStage" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <span>© 2026 草咩咩遊戲工作室</span>
    <a href="index.html">回首頁</a>
  </footer>
</body>
</html>
